services:
  app:
    build:
      context: .
    container_name: mindly-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CHAT_HISTORY_BACKEND: postgres
      DATABASE_URL: postgresql://mindly:mindly@postgres:5432/mindly
      MEMPALACE_PATH: /app/data/mempalace
    ports:
      - "8000:8000"
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: mindly-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: mindly
      POSTGRES_USER: mindly
      POSTGRES_PASSWORD: mindly
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindly -d mindly"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  app_data:
  postgres_data: